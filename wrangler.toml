name = "tear-of-god"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

# --------------------------------------------------

# Local development

# --------------------------------------------------

[[d1_databases]]
binding = "tear_of_god_db"
database_name = "tear-of-god-db"
database_id = "69d366f1-55ba-43cf-a492-882e137786f4"
preview_database_id = "tear_of_god_db"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tear-of-god"

[vars]
APP_ENV = "local"
APP_URL = "http://localhost:8788"

# --------------------------------------------------

# Preview environment

# --------------------------------------------------

[[env.preview.d1_databases]]
binding = "tear_of_god_db"
database_name = "tear-of-god-preview"
database_id = "7e770de5-77ed-4e4a-927c-74b0708039bf"

[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "tear-of-god-preview"

[env.preview.vars]
APP_ENV = "preview"
APP_URL = "https://audit-20261009.tear-of-god.pages.dev"
PREVIEW_UPLOADS_ENABLED = "false"

# --------------------------------------------------

# Production environment

# --------------------------------------------------

[[env.production.d1_databases]]
binding = "tear_of_god_db"
database_name = "tear-of-god-db"
database_id = "69d366f1-55ba-43cf-a492-882e137786f4"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "tear-of-god"

[env.production.vars]
APP_ENV = "production"
APP_URL = "https://tear-of-god.pages.dev"
NOTIFICATION_UNREAD_COUNTS = "true"
