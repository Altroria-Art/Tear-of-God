server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let React Router handle client-side routes on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable build assets aggressively; hashed by Vite.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
